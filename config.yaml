# Сбор ленты. Не долбить ЕИС: пауза и потолок карточек.
collect:
  date_from: "2025-01-01"
  months: 12
  listing_pages: 2
  region_pages: 8
  records_per_page: "_50"
  max_cards: 600
  sleep_sec: 0.35
  max_cs: 80
  max_sites: 95
  max_docs: 24
  max_doc_lists: 6
  max_file_mb: 25
  min_ocr_chars: 80
  max_ocr_pages: 6
