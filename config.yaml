# Фильтры лотов. Пример для стройки: ключи, регионы КЛАДР, порог суммы.
# Подставьте свои области. В ЕИС работает КЛАДР, голое «77» в customerPlace не ловит регион.

# Домашний код субъекта (для подписи в yaml). Сбор идёт по списку regions ниже.
region_code: "77"

# Лоты дешевле этой суммы в целевые не берём (рубли).
amount_min: 500000

# Свои юрлица, в ленту не класть. Пусто в скелете.
own_inns: []

# ЕИС: код субъекта в customerPlace игнорируется. Рабочий код: КЛАДР области.
# Несколько областей: customerPlace=кладр1,кладр2 + customerPlaceCodes=77,50,...
eis:
  customer_place_nested: true
  morphology: "off"

# Пример географии. Замените на свои КЛАДР с https://www.nalog.gov.ru (справочник КЛАДР).
regions:
  - code: "77"
    kladr: "77000000000"
    name: "Москва"
    short: "Москва"
    geo:
      - город Москва
      - г. Москва
      - Москвы
      - Москве
      - Москва
  - code: "50"
    kladr: "50000000000"
    name: "Московская область"
    short: "Московская область"
    geo:
      - Московская область
      - Подмосковье
      - Химки
      - Балашиха
      - Подольск
      - Мытищи
      - Королёв
      - Люберцы
      - Красногорск
      - Одинцово
  - code: "78"
    kladr: "78000000000"
    name: "Санкт-Петербург"
    short: "СПб"
    geo:
      - Санкт-Петербург
      - Петербург
      - Колпино
      - Пушкин
      - Петергоф

okpd_prefixes:
  - "41"
  - "41.2"
  - "41.20"
  - "42.12"
  - "42.21"
  - "43"
  - "43.12"
  - "43.99"
  - "43.29"
  - "71.12"

