# Подсказки дашборда. Простой русский, без жаргона.
# Правило: шапка таблицы закреплена при прокрутке.
# Правило: у каждой кнопки и заголовка колонки есть title / подсказка из этого файла.

table_sticky_header: true

columns:
  date: "Когда контракт появился в закупках. Свежий контракт: генподрядчику ещё могут быть нужны люди на площадку."
  region: "Где заказчик. Регион из config.yaml. Москва и Московская область в разных строках."
  amount: "Сумма контракта в рублях. Если меньше порога, такой заказ в целевые не кладём."
  subject: "Что за работы в контракте, коротко. Читайте это, а не только сумму."
  customer: "Кто заказал стройку (бюджет, школа, администрация). Запасной контакт, если до победителя не достучались."
  winner: "Кто выиграл контракт. Ему обычно и звоним: предлагаем субподряд."
  inn: "Номер фирмы в налоговой. По нему понимаем, та же это компания или однофамилец."
  source: "Откуда взяли заказ: сайт госзакупок, Москва или история контрактов."
  profile: "Какой наш вид работ сюда подходит: стройка объекта, геодезия, земля и сети, фундамент и сваи, монолит или коробка."
  status: "Куда вы сами положили карточку: новая, смотрите, берёте, не то, готово."
  contact: "Контакты победителя по источникам: сайт фирмы, ЕИС, Checko, DaData. В строке только сайт, телефон или почта."

buttons:
  login: "Войти в список заказов. Чужие сюда не попадают."
  logout: "Выйти. Список заказов с чужого компьютера больше не откроется."
  show_password: "Показать или спрятать пароль, чтобы не ошибиться при вводе."
  take: "Отметить: этим заказом займётесь вы. Чтобы не звонить дважды."
  reject: "Отметить: это не наш профиль. Больше не мешает в списке новых."
  watching: "Отметить: карточку смотрите, решение ещё не приняли."
  done: "Отметить: с этим заказом закончили."
  open_card: "Открыть карточку: кто заказчик, кто победил, сумма и ссылка на госзакупки."
  open_eis: "Открыть исходную страницу на zakupki.gov.ru в новой вкладке."
  reset_filters: "Сбросить отбор списка: снова все заказы."
  apply_filters: "Показать в таблице только то, что подходит под поля слева."
  sort_date: "Сортировать список по дате контракта. Нажмите ещё раз. наоборот."
  sort_amount: "Сортировать список по сумме. Нажмите ещё раз. наоборот."
  sort_profile: "Сортировать список по виду работ."
  toggle_filters: "Показать или спрятать поля отбора, чтобы таблица заняла больше места."

headings:
  tiles: "Сводка за выбранный период: сколько заказов нашли и сколько из них под ваши работы."
  filters: "Отбор списка. Можно оставить только крупные, только с телефоном или только монолит."
  lots: "Список заказов. Шапка таблицы не уезжает при прокрутке. колонки всегда подписаны."
