<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Вход · Радар заказов</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/favicon-192.png">
  <link rel="apple-touch-icon" href="/static/favicon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css?v=19">
</head>
<body class="auth">
  <main class="card">
    <div class="brand">
      <span class="mark">WR</span>
      <div>
        <strong>Радар заказов</strong>
        <span>Winner Radar · {{ site_host }}</span>
      </div>
    </div>
    <h1>Вход в дашборд</h1>
    <p class="lead">Стол подписанных контрактов. Вход только для своих.</p>
    {% if error %}
    <p class="err" role="alert">Неверный логин или пароль</p>
    {% endif %}
    <form method="post" action="/login" autocomplete="on">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label>
        Логин
        <input type="text" name="username" autocomplete="username" required autofocus>
      </label>
      <label class="pass-wrap">
        Пароль
        <span class="pass-row">
          <input id="password" type="password" name="password" autocomplete="current-password" required>
          <button type="button" class="eye" id="toggle-pass" aria-label="Показать пароль" aria-pressed="false" title="{{ hints.buttons.show_password if hints else 'Показать пароль' }}">
            <svg class="icon-show" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" stroke="currentColor" stroke-width="1.8"/>
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
            </svg>
            <svg class="icon-hide" width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true" hidden>
              <path d="M3 3l18 18M10.5 10.6A3 3 0 0 0 13.4 13.5M9.9 5.2A11 11 0 0 1 12 5c6.5 0 10 7 10 7a16 16 0 0 1-4.2 4.8M6.1 6.2A16 16 0 0 0 2 12s3.5 7 10 7c1.3 0 2.5-.2 3.6-.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
        </span>
      </label>
      <button type="submit" class="go" title="{{ hints.buttons.login if hints else 'Войти' }}">Войти</button>
    </form>
  </main>
  <script src="/static/login.js"></script>
  <p class="ns-credit">
    <span>Сергей Ноздров</span>
    <a href="https://github.com/SC32br" rel="noopener">SC32br</a>
  </p>
</body>
</html>
